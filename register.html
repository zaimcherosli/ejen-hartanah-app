<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://js.sentry-cdn.com/ab32fc171c3d97f3764a4402a80afc77.min.js" crossorigin="anonymous"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agent Registration | Corporate Estate Malaysia</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a192f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=53">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Clean White Navigation Header with Official CEM Logo -->
  <nav class="navbar">
    <a href="index.html" class="logo-wrap">
      <img src="logo.png" alt="Corporate Estate Malaysia Logo" class="logo-img">
      <div class="logo-text">
        CORPORATE ESTATE <span>MALAYSIA</span>
      </div>
    </a>
    <div class="nav-links">
      <a href="index.html">HOME</a>
      <a href="listings.html">VIEW LISTINGS</a>
      <a href="about.html">ABOUT US</a>
      <a href="services.html">OUR SERVICES</a>
      <a href="login.html" class="nav-btn-agent" style="color: white !important;">AGENT PORTAL</a>
    </div>
  </nav>

  <main class="container" style="display: flex; align-items: center; justify-content: center; min-height: 85vh; padding: 2rem 1rem;">
    <div class="dash-card" style="max-width: 480px; width: 100%; padding: 2.25rem 1.75rem;">
      
      <div style="text-align: center; margin-bottom: 1.25rem;">
        <img src="logo.png" alt="Corporate Estate Malaysia" style="height: 58px; width: auto; background: transparent; padding: 0;">
        <h2 style="font-size: 1.35rem; font-weight: 900; color: var(--cem-navy); margin-top: 0.5rem; margin-bottom: 0.25rem;">PENDAFTARAN EJEN BAHARU</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Daftar akaun ejen Corporate Estate Malaysia untuk kelulusan SuperAdmin</p>
      </div>

      <form id="registerForm">
        <div style="margin-bottom: 0.85rem;">
          <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.35rem;">NAMA PENUH *</label>
          <input type="text" id="fullName" placeholder="e.g. Ahmad Firdaus Bin Razak" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.9rem;">
        </div>

        <div style="margin-bottom: 0.85rem;">
          <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.35rem;">NO. WHATSAPP *</label>
          <input type="tel" id="whatsappNumber" placeholder="e.g. 0173569452" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.9rem;">
        </div>

        <div style="margin-bottom: 0.85rem;">
          <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.35rem;">REN NO (NO. PENDAFTARAN EJEN) *</label>
          <input type="text" id="renNumber" placeholder="e.g. REN 45892 / PEA 2104" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.9rem;">
        </div>

        <div style="margin-bottom: 0.85rem;">
          <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.35rem;">FOTO PROFIL / KAD REN (PILIHAN / OPTIONAL)</label>
          <div style="display: flex; align-items: center; gap: 0.85rem;">
            <div id="renPhotoPreviewContainer" style="width: 52px; height: 52px; border-radius: 50%; border: 2px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; background: #f8fafc; overflow: hidden; flex-shrink: 0;">
              <img id="renPhotoPreview" src="logo.png" alt="Preview" style="width: 100%; height: 100%; object-fit: cover; display: none;">
              <svg id="renPhotoPlaceholderIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div style="flex: 1;">
              <input type="file" id="renPhotoInput" accept="image/*" style="width: 100%; padding: 0.55rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.82rem; background: white;">
              <small style="color: var(--text-muted); font-size: 0.72rem; display: block; margin-top: 0.2rem;">Format: JPG, PNG atau WebP (Maksimum 5MB)</small>
            </div>
          </div>
        </div>

        <div style="margin-bottom: 0.85rem;">
          <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.35rem;">EMEL EJEN *</label>
          <input type="email" id="email" placeholder="e.g. agent@corporateestate.com.my" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.9rem;">
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.35rem;">KATA LALUAN (MIN 6 ABJAD/NOMBOR) *</label>
          <input type="password" id="password" minlength="6" placeholder="••••••••" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.9rem;">
        </div>

        <div id="registerAlert" style="display: none; padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; line-height: 1.4;"></div>

        <button type="submit" id="btnSubmitRegister" class="btn-show-listings" style="height: 48px; width: 100%; font-size: 0.92rem;">HANTAR PENDAFTARAN EJEN</button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.82rem; color: var(--text-muted);">
        Sudah mendaftar akaun ejen? <a href="login.html" style="color: var(--cem-navy); font-weight: 700;">Log Masuk Di Sini</a>
      </div>
    </div>
  </main>

  <script src="config.js?v=1.9.9"></script>
  <script src="register.js?v=2"></script>
  <script src="/pwa.js"></script>
</body>
</html>
