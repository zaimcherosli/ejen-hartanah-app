<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agent Dashboard | Corporate Estate Malaysia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Red Navigation Header -->
  <nav class="navbar">
    <a href="index.html" class="logo">
      CORPORATE ESTATE <span>malaysia</span> <span class="logo-badge">AGENT PORTAL</span>
    </a>
    <div class="nav-links">
      <span style="color: white; font-size: 0.82rem;">Logged in: <strong id="agentEmail">...</strong></span>
      <button id="btnLogout" class="nav-btn-agent" style="cursor: pointer;">LOGOUT</button>
    </div>
  </nav>

  <main class="container" style="padding-top: 2rem;">
    <div class="section-title">
      <h2>Agent Listing Management Dashboard</h2>
      <a href="index.html" target="_blank" style="color: var(--nav-red); font-weight: 700; font-size: 0.88rem; text-decoration: none;">🌐 Preview Live Main Site →</a>
    </div>

    <div style="display: grid; grid-template-columns: 380px 1fr; gap: 2rem;">

      <!-- Add Listing Form Card -->
      <div style="background: #ffffff; border: 1px solid var(--border-strong); border-radius: 12px; padding: 1.5rem; box-shadow: var(--shadow);">
        <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--nav-red); margin-bottom: 1rem;">+ Add New Property Listing</h3>
        
        <form id="addListingForm">
          <div style="margin-bottom: 0.85rem;">
            <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">LISTING TITLE *</label>
            <input type="text" id="title" placeholder="e.g. 3-Storey Semi-D Factory in Bukit Jelutong" required style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.85rem;">
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 0.85rem;">
            <div>
              <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">CATEGORY</label>
              <select id="category" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.85rem; background: white;">
                <option value="Industrial">Industrial</option>
                <option value="Commercial">Commercial</option>
                <option value="Land">Land</option>
              </select>
            </div>
            <div>
              <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">STATUS *</label>
              <select id="listing_type" required style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.85rem; background: white;">
                <option value="For Rent">For Rent</option>
                <option value="For Sale">For Sale</option>
              </select>
            </div>
          </div>

          <div style="margin-bottom: 0.85rem;">
            <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">PROPERTY TYPE *</label>
            <select id="property_type" required style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.85rem; background: white;">
              <option value="Detached Factory">Detached Factory</option>
              <option value="Semi-D Factory">Semi-D Factory</option>
              <option value="Warehouse">Warehouse / Logistics</option>
              <option value="Industrial Land">Industrial Land</option>
              <option value="Shoplot">Commercial Shoplot</option>
            </select>
          </div>

          <div style="margin-bottom: 0.85rem;">
            <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">ASKING PRICE (RM) *</label>
            <input type="number" id="asking_price" placeholder="e.g. 4500000" required style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.85rem;">
          </div>

          <!-- Specs -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 0.85rem;">
            <div>
              <label style="font-size: 0.72rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">POWER SUPPLY</label>
              <input type="text" id="power_supply_amp" placeholder="e.g. 300 Amp" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.85rem;">
            </div>
            <div>
              <label style="font-size: 0.72rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">CEILING HEIGHT</label>
              <input type="text" id="ceiling_height_ft" placeholder="e.g. 30 ft" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.85rem;">
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 0.85rem;">
            <div>
              <label style="font-size: 0.72rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">FLOOR LOADING</label>
              <input type="text" id="floor_loading_kn" placeholder="e.g. 25 kN/m²" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.85rem;">
            </div>
            <div>
              <label style="font-size: 0.72rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">ZONING</label>
              <select id="zoning" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.85rem; background: white;">
                <option value="Medium Industry">Medium Industry</option>
                <option value="Light Industry">Light Industry</option>
                <option value="Heavy Industry">Heavy Industry</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 0.85rem;">
            <div>
              <label style="font-size: 0.72rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">BUILT-UP (SQFT)</label>
              <input type="number" id="built_up_sqft" placeholder="15000" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.85rem;">
            </div>
            <div>
              <label style="font-size: 0.72rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">LAND AREA (SQFT)</label>
              <input type="number" id="land_area_sqft" placeholder="20000" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.85rem;">
            </div>
          </div>

          <div style="margin-bottom: 0.85rem;">
            <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">LOCATION / AREA *</label>
            <input type="text" id="location" placeholder="e.g. Shah Alam, Selangor" required style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.85rem;">
          </div>

          <div style="margin-bottom: 0.85rem;">
            <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">AGENT WHATSAPP NUMBER *</label>
            <input type="text" id="agent_phone" placeholder="60123880356" value="60123880356" required style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.85rem;">
          </div>

          <div style="margin-bottom: 0.85rem;">
            <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">PROPERTY IMAGES (AUTO-COMPRESSED)</label>
            <input type="file" id="imagesInput" multiple accept="image/*" style="width: 100%; font-size: 0.8rem;">
            <span style="font-size: 0.7rem; color: var(--accent-emerald); font-weight: 700;">⚡ Auto-compresses photos to ~150KB client-side!</span>
          </div>

          <div style="margin-bottom: 1rem;">
            <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">DESCRIPTION</label>
            <textarea id="description" rows="3" placeholder="Enter full specifications and highlights..." style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 0.85rem;"></textarea>
          </div>

          <div id="formAlert" style="display: none; padding: 0.6rem; border-radius: 6px; font-size: 0.8rem; margin-bottom: 0.85rem; text-align: center;"></div>

          <button type="submit" class="btn-show-listings" style="height: 44px; width: 100%;">SAVE LISTING</button>
        </form>
      </div>

      <!-- Listing Inventory Table -->
      <div style="background: #ffffff; border: 1px solid var(--border-strong); border-radius: 12px; padding: 1.5rem; box-shadow: var(--shadow); overflow-x: auto;">
        <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin-bottom: 1rem;">Active Inventory List</h3>

        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
          <thead>
            <tr style="border-bottom: 2px solid var(--border-strong); text-align: left; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase;">
              <th style="padding: 0.6rem;">Photo</th>
              <th style="padding: 0.6rem;">Title & Location</th>
              <th style="padding: 0.6rem;">Asking Price</th>
              <th style="padding: 0.6rem;">Status</th>
              <th style="padding: 0.6rem;">Action</th>
            </tr>
          </thead>
          <tbody id="agentListingsTbody">
            <tr><td colspan="5" style="text-align: center; padding: 1.5rem; color: var(--text-muted);">Loading active listings...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <script src="config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
